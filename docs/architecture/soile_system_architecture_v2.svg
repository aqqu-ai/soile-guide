<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

<style>
    .title { font: bold 34px Arial; fill:#e6edf3; text-anchor:middle }
    .layer { font: bold 20px Arial; fill:#e6edf3 }
    .boxtext { font: 16px Arial; fill:#ffffff; text-anchor:middle }
</style>

<rect width="1600" height="900" fill="#0d1117"/>

<text x="800" y="60" class="title">
SOILE Platform — Offline-First Tourism AI Architecture
</text>

