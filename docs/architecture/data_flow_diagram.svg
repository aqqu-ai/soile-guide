<svg width="1400" height="800" viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">

<style>
.title { font: bold 26px sans-serif; fill: #e6edf3; }
.layer { font: bold 18px sans-serif; fill: #e6edf3; }
.box { font: 15px sans-serif; fill: white; text-anchor: middle; dominant-baseline: middle; }
</style>

<rect width="100%" height="100%" fill="#0d1117"/>

<text x="700" y="60" text-anchor="middle" class="title">
SOILE Platform — Data Flow Architecture
</text>

<!-- Tourist Device -->

<rect x="150" y="180" width="240" height="120" rx="14" fill="#1f6feb"/>
<text x="270" y="220" class="box">Tourist Device</text>
<text x="270" y="245" class="box">(PWA)</text>

<!-- Local Data -->

<rect x="480" y="180" width="260" height="120" rx="14" fill="#2ea043"/>
<text x="610" y="220" class="box">Local Route Package</text>
<text x="610" y="245" class="box">Offline Maps</text>
<text x="610" y="270" class="box">Tourism Content</text>

<!-- Edge Node -->

<rect x="840" y="150" width="280" height="180" rx="16" fill="#bf3989"/>
<text x="980" y="200" class="box">Edge Intelligence Node</text>
<text x="980" y="230" class="box">Vision Pipelines</text>
<text x="980" y="255" class="box">Safety Detection</text>
<text x="980" y="280" class="box">Local Reasoning</text>

<!-- Regional Services -->

<rect x="1150" y="400" width="200" height="120" rx="14" fill="#f0883e"/>
<text x="1250" y="440" class="box">Regional Services</text>
<text x="1250" y="470" class="box">Tourism Systems</text>

<!-- Arrows -->

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
</marker>
</defs>

<line x1="390" y1="240" x2="480" y2="240" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="740" y1="240" x2="840" y2="240" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="980" y1="330" x2="1150" y2="420" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>

</svg>
